[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mt2-okey"
version = "0.1.0"
description = "Metin2 Okey Kart Etkinliği için yerel hamle öneri asistanı"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["streamlit>=1.30"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
